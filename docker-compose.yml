services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: supplyguard-api:latest
    env_file: poc/.env
    volumes:
      - ./poc/sample_docs:/app/poc/sample_docs      # shared folder the extractor reads
      - api-cache:/app/poc/.cache                   # OCR / Tavily cache survives restarts
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: supplyguard-web:latest
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8090}:80"]   # only Caddy (HTTPS + password) is public
    restart: unless-stopped
volumes:
  api-cache:
